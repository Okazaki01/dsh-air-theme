# 《AIR》夏日青空 skin bundle patch: inserts its dsh.client entry into the web
# plugin roster. The bundle is the official dsh skin shape — the desktop shell
# copies it into the profile from assets/skins (or install manually with
# `dsh plugin --profile <name> add <path>`); mutual exclusion between skins is
# managed by dsh-skin-switch (disabled rows).
- insert:
    - id: ui-skin-air
      name: '@dsh-external/dsh-client-ui-skin-air'
