<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 58">
  <!-- top-centre jewel crest: faceted gold diamond + mirrored laurel sprigs, replaces the wing -->
  <defs>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="0.45" stop-color="#f4c64f"/>
      <stop offset="0.75" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#a67a24"/>
    </linearGradient>
    <linearGradient id="spray" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c9972f"/>
      <stop offset="0.6" stop-color="#f0c460"/>
      <stop offset="1" stop-color="#ffe9a8"/>
    </linearGradient>
  </defs>
  <!-- mirrored laurel sprigs -->
  <g fill="none" stroke="url(#spray)" stroke-width="2" stroke-linecap="round">
    <path d="M74 26 C 56 20 40 22 26 32"/>
    <path d="M74 32 C 58 30 44 34 32 44"/>
    <path d="M86 26 C 104 20 120 22 134 32"/>
    <path d="M86 32 C 102 30 116 34 128 44"/>
  </g>
  <g fill="#f0c460" stroke="#b8862f" stroke-width="0.8">
    <ellipse cx="46" cy="24" rx="5" ry="3" transform="rotate(-24 46 24)"/>
    <ellipse cx="36" cy="31" rx="5" ry="3" transform="rotate(-40 36 31)"/>
    <ellipse cx="58" cy="27" rx="5" ry="3" transform="rotate(-12 58 27)"/>
    <ellipse cx="40" cy="40" rx="5" ry="3" transform="rotate(-48 40 40)"/>
    <ellipse cx="114" cy="24" rx="5" ry="3" transform="rotate(24 114 24)"/>
    <ellipse cx="124" cy="31" rx="5" ry="3" transform="rotate(40 124 31)"/>
    <ellipse cx="102" cy="27" rx="5" ry="3" transform="rotate(12 102 27)"/>
    <ellipse cx="120" cy="40" rx="5" ry="3" transform="rotate(48 120 40)"/>
  </g>
  <!-- faceted diamond -->
  <path d="M80 6 L97 28 L80 50 L63 28 Z" fill="url(#gem)" stroke="#a67a24" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M63 28 L80 50 L97 28 L80 6 Z" fill="none" stroke="#fff3cf" stroke-width="0.8" opacity="0.8"/>
  <path d="M80 6 L80 50 M63 28 L97 28 M71.5 17 L88.5 39" stroke="#fff6da" stroke-width="0.7" opacity="0.85"/>
  <circle cx="80" cy="21" r="2.2" fill="#ffffff" opacity="0.9"/>
  <!-- small drop gem under the diamond -->
  <rect x="77" y="51" width="6" height="6" transform="rotate(45 80 54)" fill="#f4c64f" stroke="#a67a24" stroke-width="1"/>
</svg>
