<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 240">
  <!-- slim gold vertical ornament: two hairline gold lines + tiny diamond beads, sits ON the card border (no overlap into content) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a67a24"/>
      <stop offset="0.5" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#a67a24"/>
    </linearGradient>
  </defs>
  <line x1="3.5" y1="0" x2="3.5" y2="240" stroke="url(#g)" stroke-width="1.5"/>
  <line x1="10.5" y1="0" x2="10.5" y2="240" stroke="url(#g)" stroke-width="1.5"/>
  <g fill="#ffe9a8" stroke="#b8862f" stroke-width="1">
    <rect x="5" y="16" width="4" height="4" transform="rotate(45 7 18)"/>
    <rect x="5" y="64" width="4" height="4" transform="rotate(45 7 66)"/>
    <rect x="5" y="112" width="4" height="4" transform="rotate(45 7 114)"/>
    <rect x="5" y="160" width="4" height="4" transform="rotate(45 7 162)"/>
    <rect x="5" y="208" width="4" height="4" transform="rotate(45 7 210)"/>
  </g>
